name: aurii

# Local developer environment. Not the internet-facing reference deployment.
# See deploy/compose.reference.yml and docs/DEPLOYMENT.md for production shape.
#
#   docker compose up
#
# Core:    http://localhost:3000
# Studio:  http://localhost:4321
# Swagger: http://localhost:3000/swagger
#
# Postgres is bound to loopback only.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurii
      POSTGRES_PASSWORD: aurii
      POSTGRES_DB: aurii
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurii -d aurii"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.core
    environment:
      DATABASE_URL: postgres://aurii:aurii@postgres:5432/aurii
    command: ["bun", "run", "packages/db/scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
      args:
        AURII_VERSION: ${AURII_VERSION:-0.1.0}
        AURII_GIT_SHA: ${AURII_GIT_SHA:-dev}
        AURII_BUILD_TIME: ${AURII_BUILD_TIME:-local}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AURII_STORAGE: postgres
      DATABASE_URL: postgres://aurii:aurii@postgres:5432/aurii
      PORT: "3000"
      AURII_CORS_ORIGINS: ${AURII_CORS_ORIGINS:-http://localhost:4321,http://127.0.0.1:4321}
      AURII_API_TOKEN: ${AURII_API_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health'); if (!r.ok) process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
      args:
        PUBLIC_AURII_CORE_URL: ${PUBLIC_AURII_CORE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "4321:4321"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["studio"]

volumes:
  postgres_data:
