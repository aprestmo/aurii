name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Core ──────────────────────────────────────────────────────────────────────
  core:
    name: core — typecheck, lint, test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/core
        run: bun run typecheck
      - name: Lint
        working-directory: packages/core
        run: bun run lint
      - name: Test
        working-directory: packages/core
        run: bun run test

  # ── Core (PostgreSQL) ─────────────────────────────────────────────────────────
  core-postgres:
    name: core — test (PostgreSQL adapter)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurii
          POSTGRES_PASSWORD: aurii
          POSTGRES_DB: aurii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aurii:aurii@localhost:5432/aurii_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Test against real PostgreSQL/JSONB
        working-directory: packages/core
        run: bun run test

  # ── SDK ───────────────────────────────────────────────────────────────────────
  sdk:
    name: sdk — typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Core dependencies (SDK typecheck imports Core)
        working-directory: packages/core
        run: bun install --frozen-lockfile
      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/sdk
        run: bun run typecheck
      - name: Install workspace (fixture contract tests)
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: packages/sdk
        run: bun run test

  # ── Studio ────────────────────────────────────────────────────────────────────
  studio:
    name: studio — build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Install Studio app lockfile
        working-directory: apps/studio
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/studio
        run: bun run build
      - name: Test
        working-directory: apps/studio
        run: bun run test

  # ── HTTP API / platform adapter ───────────────────────────────────────────────
  api:
    name: api — typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: apps/api
        run: bun run test

  # ── Platform packages ─────────────────────────────────────────────────────────
  platform:
    name: platform — types, validation, db, studio package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Types
        run: bun run --filter='@aurii/types' test && bun run --filter='@aurii/types' typecheck
      - name: Validation
        run: bun run --filter='@aurii/validation' test && bun run --filter='@aurii/validation' typecheck
      - name: DB
        run: bun run --filter='@aurii/db' test && bun run --filter='@aurii/db' typecheck
      - name: Studio package
        run: bun run --filter='@aurii/studio' test

  # ── External-consumer contract ────────────────────────────────────────────────
  external-consumer:
    name: external-consumer — fixture, pack, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Architecture boundary
        run: bun test tests/architecture
      - name: Pack public packages and install in a clean consumer
        run: bun test tests/pack
      - name: Core fixture contract
        working-directory: packages/core
        run: bun test src/__tests__/external-product-contract.test.ts
